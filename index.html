<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو بروفايلات وتشكيل أسماء التيك توك VIP</title>
    <!-- استدعاء خطوط كاليجرافي عربية فخمة من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-gold: #ffd700;
            --accent-cyan: #00f2fe;
            --accent-green: #25d366;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 20%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* كرت الحماية العلوي */
        .security-badge {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* كرت المدخلات الرئيسي */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        input, select, textarea {
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* أزرار الإجراءات السريعة */
        .action-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 180px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-export {
            background: linear-gradient(45deg, #00f2fe, #0099ff);
            color: #000;
        }

        .btn-whatsapp {
            background: var(--accent-green);
            color: #fff;
        }

        .btn-copy {
            background: #ffd700;
            color: #000;
        }

        /* معاينة البروفايل (مثل التيك توك) */
        .preview-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .profile-card {
            width: 340px;
            background: #000000;
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .badge-vip {
            position: absolute;
            top: 10px;
            right: 15px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            padding: 3px;
            margin-bottom: 5px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
        }

        .profile-name {
            font-size: 1.4rem;
            color: #fff;
            word-break: break-word;
            line-height: 1.4;
        }

        .profile-badge-text {
            color: var(--accent-cyan);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .profile-bio {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #cbd5e1;
            width: 100%;
            white-space: pre-line;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            margin-top: 5px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-weight: 900;
            font-size: 0.9rem;
            color: #fff;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* قائمة التشكيلات والزخارف المتنوعة */
        .styles-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .style-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: border-color 0.3s;
        }

        .style-item:hover {
            border-color: var(--accent-cyan);
        }

        .style-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .style-label {
            font-size: 0.75rem;
            color: var(--accent-cyan);
        }

        .style-result {
            font-size: 1.1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .style-btns {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-apply {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-copy-sm {
            background: #ff4757;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="security-badge">🔒 VIP Basem Zerba محمّي بنظام</div>
        <h1>مولد زخارف تيك توك الفخمة</h1>
        <p>خطوط كالليجرافي عربية • رموز هيبة • إهداءات VIP</p>
    </header>

    <!-- أدوات التحكم والمدخلات -->
    <div class="controls-card">
        <div class="form-group">
            <label for="inputName">الاسم المراد زخرفته:</label>
            <input type="text" id="inputName" value="أبو باسم" placeholder="اكتب اسمك هنا...">
        </div>

        <div class="form-group">
            <label for="fontSelect">خط كرت المعاينة:</label>
            <select id="fontSelect">
                <option value="'Reem Kufi', sans-serif">خط الكوفي العريض (Reem Kufi)</option>
                <option value="'Aref Ruqaa', serif">خط الرقعة العربي (Aref Ruqaa)</option>
                <option value="'Amiri', serif">خط النسخ والثلث (Amiri)</option>
                <option value="'Cairo', sans-serif">خط السايبر الحديث (Cairo)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="badgeSelect">شارة التوثيق والـ VIP:</label>
            <select id="badgeSelect">
                <option value="👑 تاج الملك VIP">تاج الملك VIP 👑</option>
                <option value="⚡ موثق صانع محتوى">موثق صانع محتوى ⚡</option>
                <option value="💎 حساب ماسي VIP">حساب ماسي VIP 💎</option>
                <option value="🔥 الهيبة الأسطورية">الهيبة الأسطورية 🔥</option>
            </select>
        </div>

        <div class="form-group">
            <label for="inputFollowers">عدد المتابعين:</label>
            <input type="text" id="inputFollowers" value="1.2M">
        </div>

        <div class="form-group">
            <label for="inputAvatar">صورة البروفايل (الأفاتار):</label>
            <input type="file" id="inputAvatar" accept="image/*">
        </div>

        <div class="form-group full-width">
            <label for="inputBio">رسالة الإهداء / Bio البروفايل:</label>
            <textarea id="inputBio" rows="2">💎 صانع محتوى مميز • إهداء خاص من Basem Zerba</textarea>
        </div>

        <div class="action-btns full-width">
            <button class="btn btn-export" onclick="exportCard()">📸 تصدير الكرت صورة (PNG)</button>
            <button class="btn btn-copy" onclick="copyBioLink()">🔑 نسخ رابط الإهداء</button>
            <button class="btn btn-whatsapp" onclick="sendWhatsapp()">💬 إرسال الحزمة عبر الواتساب</button>
        </div>
    </div>

    <!-- كرت البروفايل المباشر -->
    <div class="preview-wrapper">
        <div class="profile-card" id="profileCard">
            <div class="badge-vip">Basem Zerba VIP</div>
            <div class="avatar-container">
                <img src="https://via.placeholder.com/150/1e293b/ffffff?text=Avatar" id="cardAvatar" class="avatar-img" alt="Avatar">
            </div>
            <div class="profile-name" id="cardName">༺ 👑 أبو باسم 👑 ༻</div>
            <div class="profile-badge-text" id="cardBadge">👑 تاج الملك VIP</div>
            <div class="profile-bio" id="cardBio">💎 صانع محتوى مميز • إهداء خاص من Basem Zerba</div>
            
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-num" id="cardFollowers">1.2M</span>
                    <span class="stat-label">المتابعين</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">15.4M</span>
                    <span class="stat-label">تسجيلات الإعجاب</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">340</span>
                    <span class="stat-label">يتابع</span>
                </div>
            </div>
        </div>
    </div>

    <!-- قائمة الخيارات: المط، التشكيل، التفكيك، والزخارف -->
    <div class="styles-section">
        <div class="section-title">✨ تشكيلات وزخارف التيك توك الفخمة:</div>
        <div id="stylesList" class="styles-section"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. مصفوفة خيارات تشكيل ومط الاسم والزخارف
    // ==========================================
    const styleTemplates = [
        // --- خيارات تحريك ومط نفس أحرف الاسم (الترند الحالي) ---
        { label: "مط حروف الاسم العريض (الكشيدة)", fn: name => name.split('').join('ـ') },
        { label: "نمط التباعد الفخم (Spaced-Out)", fn: name => name.split('').join(' ') },
        { label: "نمط التشكيل العربي الكامل", fn: name => name.replace(/ا/g, 'آ').replace(/و/g, 'ؤ').replace(/م/g, 'مٌ').replace(/ب/g, 'بً').replace(/س/g, 'سٍ') },
        { label: "نمط الحركات فوق الحروف", fn: name => name.split('').join('َ') },
        { label: "نمط التفكيك بالرموز المنسقة", fn: name => name.split('').join('・') },
        { label: "نمط الصواعق بين الحروف", fn: name => name.split('').join('⚡') },
        
        // --- دعم الأسماء بالإنجليزي (حجم عريض ومفرغ) ---
        { label: "نمط الإنجليزي العريض (Fullwidth)", fn: name => name.replace(/[a-zA-Z0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xfee0)) },
        { label: "نمط الخط المفرغ (Outline)", fn: name => name.replace(/[a-zA-Z]/g, c => String.fromCodePoint(c.charCodeAt(0) + 0x1D538 - (c <= 'Z' ? 65 : 97))) },

        // --- أنماط الزخارف الهيبة والأطر لعام 2026 ---
        { label: "زخرفة الهيبة الرائجة 2026 (Aesthetic)", fn: name => `꧁ ${name} ꧂` },
        { label: "نمط الإطار الملكي الفخم", fn: name => `༺ 👑 ${name} 👑 ༻` },
        { label: "زخرفة خط الرقعة العربي الأصيل", fn: name => `✍️ ${name}` },
        { label: "نمط النسر والصاعقة VIP", fn: name => `آبـ⚡ـو بـآسـم` },
        { label: "نمط التاج والشعار العالي", fn: name => `👑 ┆ ${name} ┆ 👑` },
        { label: "زخرفة الكوفي العريض العثماني", fn: name => `أًبٌوُ بٌاَسٌمِ` },
        { label: "نمط الأقواس المنسقة", fn: name => `𓆩 ${name} 𓆪` },
        { label: "نمط الشارة والنجمة الفخمة", fn: name => `★彡 [ ${name} ] 彡★` },
        { label: "نمط القاطعة السايبر", fn: name => `⚡ ${name} ⚡` }
    ];

    // ==========================================
    // 2. تحديث الشاشة التفاعلية والمعاينة
    // ==========================================
    const inputName = document.getElementById('inputName');
    const fontSelect = document.getElementById('fontSelect');
    const badgeSelect = document.getElementById('badgeSelect');
    const inputFollowers = document.getElementById('inputFollowers');
    const inputBio = document.getElementById('inputBio');
    const inputAvatar = document.getElementById('inputAvatar');

    const cardName = document.getElementById('cardName');
    const cardBadge = document.getElementById('cardBadge');
    const cardFollowers = document.getElementById('cardFollowers');
    const cardBio = document.getElementById('cardBio');
    const cardAvatar = document.getElementById('cardAvatar');
    const stylesList = document.getElementById('stylesList');

    function updatePreview() {
        const val = inputName.value.trim() || "أبو باسم";
        cardName.textContent = `༺ 👑 ${val} 👑 ༻`;
        cardName.style.fontFamily = fontSelect.value;
        cardBadge.textContent = badgeSelect.value;
        cardFollowers.textContent = inputFollowers.value || "1.2M";
        cardBio.textContent = inputBio.value;

        // إعادة بناء قائمة الزخارف وتشكيل الاسم
        stylesList.innerHTML = '';
        styleTemplates.forEach((style) => {
            const transformed = style.fn(val);
            
            const item = document.createElement('div');
            item.className = 'style-item';
            item.innerHTML = `
                <div class="style-info">
                    <span class="style-label">${style.label}</span>
                    <span class="style-result">${transformed}</span>
                </div>
                <div class="style-btns">
                    <button class="btn-sm btn-apply" onclick="applyToCard('${transformed.replace(/'/g, "\\'")}')">تطبيق 👁️</button>
                    <button class="btn-sm btn-copy-sm" onclick="copyText('${transformed.replace(/'/g, "\\'")}')">نسخ 📋</button>
                </div>
            `;
            stylesList.appendChild(item);
        });
    }

    // تطبيق النمط المختار مباشرة على كرت المعاينة
    function applyToCard(text) {
        cardName.textContent = text;
    }

    // نسخ النص للحافظة
    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("تم نسخ الاسم بنجاح: " + text);
        });
    }

    // رفع صورة الأفاتار
    inputAvatar.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                cardAvatar.src = evt.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // الاستماع للتغييرات بجميع الحقول
    [inputName, fontSelect, badgeSelect, inputFollowers, inputBio].forEach(el => {
        el.addEventListener('input', updatePreview);
    });

    // ==========================================
    // 3. التصدير والمشاركة (Image / Whatsapp / Link)
    // ==========================================
    function exportCard() {
        const card = document.getElementById('profileCard');
        html2canvas(card, { backgroundColor: '#000000', scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Tiktok_Profile_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function copyBioLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert("تم نسخ رابط الاستوديو بنجاح!");
        });
    }

    function sendWhatsapp() {
        const name = cardName.textContent;
        const text = `🔥 هدية بروفايل تيك توك VIP 🔥\n\nالاسم المزخرف: ${name}\nالشارة: ${badgeSelect.value}\n\nتم التصميم عبر استوديو التشكيل والزخارف: ${window.location.href}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    // التشغيل الأولي
    updatePreview();
</script>

</body>
</html>
