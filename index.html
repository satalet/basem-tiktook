<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو بروفايلات وتشكيلات تيك توك الفخمة | Basem Zerba VIP</title>
    <!-- خطوط عربية فخمة من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800;900&family=Reem+Kufi:wght@700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة تصدير الصور ومكتبة الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(18, 19, 28, 0.85);
            --primary-neon: #00f2fe;
            --accent-pink: #ff2a5f;
            --gold-vip: #ffd700;
            --text-color: #ffffff;
            --border-glow: rgba(0, 242, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 10px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية الجسيمات */
        #cyberCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* الهيدر والعناوين */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(45deg, #111, #222);
            border: 1px solid var(--gold-vip);
            color: var(--gold-vip);
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-neon);
            margin-bottom: 5px;
        }

        .header p {
            color: #a0a5c0;
            font-size: 13px;
        }

        /* لوحة التحكم والمدخلات */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--primary-neon);
            font-weight: 600;
        }

        .input-group input, .input-group select {
            background: #12131c;
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }

        /* العداد التفاعلي للبايو */
        .bio-wrapper {
            position: relative;
        }

        .bio-counter {
            position: absolute;
            left: 10px;
            top: 36px;
            font-size: 11px;
            color: var(--primary-neon);
            font-weight: bold;
        }

        /* الأزرار الرئيسيّة */
        .actions-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-export { background: var(--primary-neon); color: #000; }
        .btn-copy { background: var(--gold-vip); color: #000; }
        .btn-whatsapp { background: #25d366; color: #fff; width: 100%; margin-top: 5px; }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }

        /* كرت المعاينة التفاعلي VIP */
        .preview-card-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .preview-card {
            width: 100%;
            max-width: 420px;
            background: #0d0e15;
            border: 2px solid var(--gold-vip);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
            overflow: hidden;
        }

        .preview-card .top-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--gold-vip);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .avatar-box {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            border-radius: 50%;
            border: 3px solid var(--gold-vip);
            overflow: hidden;
            background: #1a1b26;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .preview-badge-sub {
            font-size: 12px;
            color: var(--primary-neon);
            margin-bottom: 12px;
        }

        .preview-bio {
            font-size: 13px;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .preview-stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            margin-bottom: 15px;
        }

        .stat-num { font-size: 16px; font-weight: 900; color: #fff; }
        .stat-lbl { font-size: 11px; color: #8a8f style; color: #8a8f structure; color: #8a8fbd; }

        /* مكان عرض الـ QR Code داخل كرت المعاينة */
        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 10px;
            width: fit-content;
            margin: 0 auto;
            border: 1px dashed var(--primary-neon);
        }

        /* قائمة زخارف التيك توك الفخمة */
        .styles-section-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .styles-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .style-item {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: 0.3s;
        }

        .style-item:hover {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        .style-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .style-label {
            font-size: 11px;
            color: var(--primary-neon);
        }

        .style-result {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .style-btns {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-apply { background: var(--primary-neon); color: #000; }
        .btn-copy-sm { background: var(--accent-pink); color: #fff; }

        .btn-sm:hover { opacity: 0.9; transform: scale(1.05); }

        @media (max-width: 600px) {
            .style-item { flex-direction: column; align-items: flex-start; }
            .style-btns { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- 1. خلفية الجسيمات التفاعلية Cyber Canvas -->
    <canvas id="cyberCanvas"></canvas>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div class="vip-badge">🔒 محمي بنظام VIP Basem Zerba</div>
            <h1>مولد زخارف تيك توك الفخمة</h1>
            <p>خطوط كالايجرافي عربية • رموز هيبة • إهداءات VIP</p>
        </div>

        <!-- لوحة التحكم بالكرت -->
        <div class="control-panel">
            <div class="grid-inputs">
                <div class="input-group">
                    <label>الاسم المراد زخرفته:</label>
                    <input type="text" id="nameInput" value="أبو باسم" oninput="updateAll()">
                </div>

                <div class="input-group">
                    <label>خط كرت المعاينة:</label>
                    <select id="fontSelect" onchange="updateAll()">
                        <option value="'Aref Ruqaa', serif">خط الرقعة العربي (Aref Ruqaa)</option>
                        <option value="'Cairo', sans-serif">خط القاهرة الحديث (Cairo)</option>
                        <option value="'Reem Kufi', sans-serif">خط الكوفي العريض (Reem Kufi)</option>
                        <option value="'Tajawal', sans-serif">خط تجوال السايبر (Tajawal)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>شارة التوثيق والـ VIP:</label>
                    <select id="badgeSelect" onchange="updateAll()">
                        <option value="👑 تاج الملك VIP">تاج الملك VIP 👑</option>
                        <option value="⚡ صاعقة الهيبة VIP">صاعقة الهيبة VIP ⚡</option>
                        <option value="💎 الماسي VIP">الماسي VIP 💎</option>
                        <option value="🔥 التنين الأسود">التنين الأسود 🔥</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>عدد المتابعين:</label>
                    <input type="text" id="followersInput" value="1.2M" oninput="updateAll()">
                </div>

                <div class="input-group">
                    <label>صورة البروفايل (الافاتار):</label>
                    <input type="file" id="avatarInput" accept="image/*" onchange="loadAvatar(event)">
                </div>

                <!-- 3. بايو التيك توك مع العداد التفاعلي (80 حرف) -->
                <div class="input-group bio-wrapper">
                    <label>رسالة الإهداء / Bio البروفايل:</label>
                    <input type="text" id="bioInput" maxlength="80" value="🚀 صانع محتوى مميز • إهداء خاص من Basem Zerba 💎" oninput="updateBioCounter()">
                    <span id="bioCounter" class="bio-counter">0/80</span>
                </div>
            </div>

            <!-- أزرار العمليات -->
            <div class="actions-flex">
                <button class="btn btn-export" onclick="exportCardPNG()">📷 تصدير الكرت صورة (PNG)</button>
                <button class="btn btn-copy" onclick="copyGiftLink()">🔗 نسخ رابط الإهداء</button>
            </div>
            <button class="btn btn-whatsapp" onclick="sendWhatsapp()">💬 إرسال الحزمة عبر الواتساب</button>
        </div>

        <!-- كرت المعاينة التفاعلي VIP -->
        <div class="preview-card-container">
            <div class="preview-card" id="previewCard">
                <div class="top-tag">Basem Zerba VIP</div>
                <div class="avatar-box">
                    <img id="avatarImg" src="https://via.placeholder.com/150/00f2fe/000000?text=👑" alt="Avatar">
                </div>
                <div class="preview-name" id="previewName">أبو باسم</div>
                <div class="preview-badge-sub" id="previewBadge">👑 تاج الملك VIP</div>
                <div class="preview-bio" id="previewBio">🚀 صانع محتوى مميز • إهداء خاص من Basem Zerba 💎</div>

                <div class="preview-stats">
                    <div>
                        <div class="stat-num" id="statFollowers">1.2M</div>
                        <div class="stat-lbl">المتابعين</div>
                    </div>
                    <div>
                        <div class="stat-num">15.4M</div>
                        <div class="stat-lbl">تسجيلات الإعجاب</div>
                    </div>
                    <div>
                        <div class="stat-num">340</div>
                        <div class="stat-lbl">يتابع</div>
                    </div>
                </div>

                <!-- 4. رمز الـ QR Code المدمج بداخل الكرت -->
                <div class="qr-wrapper">
                    <div id="qrcode"></div>
                </div>
            </div>
        </div>

        <!-- قائمة الزخارف الفخمة -->
        <div class="styles-section-title">
            <span>✨ تشكيلات وزخارف التيك توك الفخمة:</span>
        </div>

        <div class="styles-list" id="stylesList">
            <!-- سيتم توليد العناصر هنا ديناميكياً -->
        </div>
    </div>

    <!-- السكربت والبرمجة التفاعلية -->
    <script>
        // ==========================================
        // 1. خلفية الجسيمات السايبر التفاعلية (Canvas)
        // ==========================================
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                size: Math.random() * 2 + 1
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.08)';

            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                for(let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if(dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ==========================================
        // 2. المؤثرات الصوتية المستقبلية (Web Audio Synth)
        // ==========================================
        function playCyberSound(type = 'click') {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (type === 'copy') {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.09);
                } else {
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.07);
                }

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        // ==========================================
        // 3. أنماط الزخارف التفاعلية
        // ==========================================
        const styleTemplates = [
            { label: "زخرفة الهيبة الرائجة 2026 (Aesthetic)", fn: name => `꧁ ${name} ꧂` },
            { label: "نمط الإطار الملكي الفخم", fn: name => `༺ 👑 ${name} 👑 ༻` },
            { label: "زخرفة خط الرقعة العربي الأصيل", fn: name => `✍️ ${name}` },
            { label: "نمط النسر والصاعقة VIP", fn: name => `آبـ⚡ـو بـآسـم` },
            { label: "نمط التاج والشعار العالي", fn: name => `👑 ┆ ${name} ┆ 👑` },
            { label: "زخرفة الكوفي العريض العثماني", fn: name => `أبُــو بَــاسِــم` },
            { label: "نمط الأقواس المنسقة", fn: name => `𓆩 ${name} 𓆪` },
            { label: "نمط الشارة والنجمة الفخمة", fn: name => `★彡 [ ${name} ] 彡★` },
            { label: "نمط القاطعة السايبر", fn: name => `⚡ ${name} ⚡` }
        ];

        function renderStylesList(rawName) {
            const container = document.getElementById('stylesList');
            container.innerHTML = '';

            styleTemplates.forEach((item, idx) => {
                const decorated = item.fn(rawName);
                const el = document.createElement('div');
                el.className = 'style-item';
                el.innerHTML = `
                    <div class="style-info">
                        <span class="style-label">${item.label}</span>
                        <span class="style-result" id="res-${idx}">${decorated}</span>
                    </div>
                    <div class="style-btns">
                        <button class="btn-sm btn-apply" onclick="applyToCard('${decorated}')">👁️ تطبيق</button>
                        <button class="btn-sm btn-copy-sm" onclick="copyText('${decorated}')">📋 نسخ</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // ==========================================
        // 4. تحديث الكرت وعداد البايو و QR Code
        // ==========================================
        function updateBioCounter() {
            const input = document.getElementById('bioInput');
            const counter = document.getElementById('bioCounter');
            const len = input.value.length;
            
            counter.textContent = `${len}/80`;
            if (len >= 80) {
                counter.style.color = '#ff2a5f';
            } else {
                counter.style.color = '#00f2fe';
            }
            updateAll();
        }

        function renderQRCode(text) {
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: text || "https://www.tiktok.com",
                width: 55,
                height: 55,
                colorDark : "#00f2fe",
                colorLight : "#0d0e15",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function updateAll() {
            const name = document.getElementById('nameInput').value || 'أبو باسم';
            const font = document.getElementById('fontSelect').value;
            const badge = document.getElementById('badgeSelect').value;
            const followers = document.getElementById('followersInput').value || '1.2M';
            const bio = document.getElementById('bioInput').value;

            // تحديث كرت المعاينة
            const previewName = document.getElementById('previewName');
            previewName.textContent = name;
            previewName.style.fontFamily = font;

            document.getElementById('previewBadge').textContent = badge;
            document.getElementById('statFollowers').textContent = followers;
            document.getElementById('previewBio').textContent = bio;

            // تحديث القائمة و الـ QR
            renderStylesList(name);
            renderQRCode(`https://www.tiktok.com/search?q=${encodeURIComponent(name)}`);
        }

        function applyToCard(text) {
            playCyberSound('click');
            const previewName = document.getElementById('previewName');
            previewName.textContent = text;
        }

        function copyText(text) {
            playCyberSound('copy');
            navigator.clipboard.writeText(text);
            alert(`✅ تم نسخ الزخرفة: ${text}`);
        }

        function loadAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('avatarImg').src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // تصدير الكرت كصورة PNG
        function exportCardPNG() {
            playCyberSound('click');
            const card = document.getElementById('previewCard');
            html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `TikTok_VIP_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function copyGiftLink() {
            playCyberSound('copy');
            navigator.clipboard.writeText(window.location.href);
            alert("🔗 تم نسخ رابط الصفحة بنجاح!");
        }

        function sendWhatsapp() {
            playCyberSound('click');
            const name = document.getElementById('previewName').textContent;
            const msg = `🔥 اهداء خاص من استوديو زخارف تيك توك VIP:\n\nالاسم المزخرف: ${name}\nرابط الاستوديو: ${window.location.href}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // تشغيل أولي عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            updateBioCounter();
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => playCyberSound('click'));
            });
        });
    </script>
</body>
</html>
