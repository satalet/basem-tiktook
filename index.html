<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basem Zorba - Real Name</title>
    
    <!-- استدعاء الخطوط مباشرة من Google Fonts لضمان عملها على الجوال -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --accent-gold: #d4af37;
            --text-white: #f0f6fc;
            --text-gray: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .card {
            background: linear-gradient(145deg, #121721, #1a2332);
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            margin-bottom: 25px;
        }

        .badge-top {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .avatar-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            margin: 10px auto 15px;
            background: #0d1117;
        }

        .display-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 45px;
            color: var(--text-white);
        }

        .sub-badge {
            color: var(--accent-gold);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .input-box {
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            color: var(--text-gray);
            font-size: 13px;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-bottom: 15px;
        }

        .stat-item .num {
            font-weight: bold;
            font-size: 16px;
        }

        .stat-item .label {
            font-size: 12px;
            color: var(--text-gray);
        }

        .footer-tag {
            font-size: 10px;
            color: var(--text-gray);
        }

        .controls-panel {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tag-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .tag-btn.active {
            background: #f1e05a;
            color: #000;
            font-weight: bold;
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
        }

        .result-title {
            font-size: 10px;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .result-text {
            font-size: 20px;
            text-align: center;
            margin: 10px 0;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-copy {
            background: #238636;
            color: white;
        }

        .btn-apply {
            background: #1f6feb;
            color: white;
        }

        /* فئات الخطوط للزخارف */
        .font-amiri { font-family: 'Amiri', serif; }
        .font-aref { font-family: 'Aref Ruqaa', serif; }
        .font-reem { font-family: 'Reem Kufi', sans-serif; }
        .font-cairo { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

    <!-- كارت المعاينة -->
    <div class="card" id="preview-card">
        <div class="badge-top">BASEM ZORBA • VIP</div>
        <div class="avatar-ring"></div>
        <div class="display-name font-aref" id="main-display">أبُو بَاسِم</div>
        <div class="sub-badge">VIP ملكي 👑</div>
        <div class="input-box">🔥 اسمك، بطريقتك<br>صمم • زخرف • انسخ</div>
        
        <div class="stats-container">
            <div class="stat-item">
                <div class="num">1.2M</div>
                <div class="label">المتابعين</div>
            </div>
            <div class="stat-item">
                <div class="num">15.4M</div>
                <div class="label">الإعجابات</div>
            </div>
            <div class="stat-item">
                <div class="num">340</div>
                <div class="label">يتابع</div>
            </div>
        </div>
        <div class="footer-tag">crafted by Basem Zorba</div>
    </div>

    <!-- لوحة التحكم والنتائج -->
    <div class="controls-panel">
        <div class="controls-header">
            <h3>🧬 نتائج المحرك</h3>
            <span style="font-size: 12px; color: var(--text-gray);">16 نتيجة</span>
        </div>

        <div class="filter-tags">
            <button class="tag-btn active">الكل</button>
            <button class="tag-btn">تشكيل</button>
            <button class="tag-btn">داخل الحروف</button>
            <button class="tag-btn">الحروف</button>
            <button class="tag-btn">كشيدة</button>
        </div>

        <div class="results-grid">
            <div class="result-card">
                <div class="result-title">تشكيل • تشكيل مرکب 01</div>
                <div class="result-text font-aref">أبُو بَاسِم</div>
                <div class="result-actions">
                    <button class="btn btn-copy" onclick="copyText('أبُو بَاسِم')">نسخ 📋</button>
                    <button class="btn btn-apply" onclick="applyText('أبُو بَاسِم', 'font-aref')">تطبيق 👁️</button>
                </div>
            </div>

            <div class="result-card">
                <div class="result-title">داخل الحروف • خط داخلي مزدوج</div>
                <div class="result-text font-reem">أبــو بـاســم</div>
                <div class="result-actions">
                    <button class="btn btn-copy" onclick="copyText('أبــو بـاســم')">نسخ 📋</button>
                    <button class="btn btn-apply" onclick="applyText('أبــو بـاســم', 'font-reem')">تطبيق 👁️</button>
                </div>
            </div>

            <div class="result-card">
                <div class="result-title">تشكيل • خط أميري تقليدي</div>
                <div class="result-text font-amiri">أَبُو بَاسِمٍ</div>
                <div class="result-actions">
                    <button class="btn btn-copy" onclick="copyText('أَبُو بَاسِمٍ')">نسخ 📋</button>
                    <button class="btn btn-apply" onclick="applyText('أَبُو بَاسِمٍ', 'font-amiri')">تطبيق 👁️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- استدعاء html2canvas المحلي -->
    <script src="assets/js/html2canvas.min.js"></script>
    <script>
        function applyText(text, fontClass) {
            const mainDisplay = document.getElementById('main-display');
            mainDisplay.innerText = text;
            mainDisplay.className = 'display-name ' + fontClass;
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('تم النسخ: ' + text);
        }
    </script>
</body>
</html>
